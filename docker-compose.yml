name: noto
services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5433}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-noto}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-noto_dev_password_change_me}
      POSTGRES_DB: ${POSTGRES_DB:-noto}
    volumes:
      - noto-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-noto} -d ${POSTGRES_DB:-noto}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  noto-pgdata:
